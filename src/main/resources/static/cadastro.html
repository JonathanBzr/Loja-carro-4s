    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Loja de Carros</title>
</head>
<body>
    <h1>Cadastrar Usuário</h1>

    <form action="/cadastrar" method="POST" enctype="application/x-www-form-urlencoded">
        <label>Nome: <input type="text" name="nome" required></label><br>
        <label>Cargo: <input type="text" name="cargo"></label><br>
        <label>Salário: <input type="number" name="salario" step="0.01"></label><br>
        <label>Login: <input type="text" name="login" required></label><br>
        <label>Senha: <input type="password" name="senha" required></label><br>
        <button type="submit">Cadastrar</button>
    </form>

    <p>Já tem conta? <a href="/login.html">Entrar</a></p>
</body>
</html>
